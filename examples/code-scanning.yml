name: ZeroLens Code Scanning Integration

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  security_scan:
    runs-on: ubuntu-latest
    permissions:
      security-events: write  # for SARIF upload
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Build binary
        run: |
          make build

      - name: ZeroLens Scan
        id: zerolens
        uses: netrise/zerolens-action@v1
        with:
          token: ${{ secrets.ZEROLENS_TOKEN }}
          binary: build/myapp # Update to your binary path
          sarif_path: out/scan.sarif

      - name: Upload SARIF to GitHub
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: out/scan.sarif 