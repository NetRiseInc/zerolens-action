name: EX05 – Code Scanning Integration Test

on:
  push:
    branches:
      - 'EX05*'
  workflow_dispatch:

jobs:
  ex05_scan:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      # Build the Action at HEAD for accurate testing
      - name: Setup Node & deps
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - run: npm ci
      - run: npm run build

      # Compile dummy C binary included in repo
      - name: Build dummy binary
        run: make -C examples/dummy-project

      # Run ZeroLens scan with SARIF output
      - name: ZeroLens Scan (EX05)
        id: zerolens
        uses: ./
        with:
          token: ${{ secrets.ZEROLENS_TOKEN }}
          binary: build/dummy
          sarif_path: out/dummy.sarif
          wait: true

      # Upload SARIF to GitHub Security tab
      - name: Upload SARIF to GitHub
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: out/dummy.sarif

      # Upload artefacts for manual inspection
      - name: Upload report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: EX05-report
          path: |
            ${{ steps.zerolens.outputs.report }}
            out/dummy.sarif 