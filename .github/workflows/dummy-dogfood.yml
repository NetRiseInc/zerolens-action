name: Dogfood – ZeroLens on Dummy C Project

on:
  push:
    paths:
      - "examples/dummy-project/**"
      - ".github/workflows/dummy-dogfood.yml"
  workflow_dispatch:

jobs:
  dummy_scan:
    permissions:
      contents: read
      issues: write
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 1. Install deps & build bundle so we truly use the HEAD revision
      - name: Setup Node & deps
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
      - run: npm ci
      - run: npm run build

      # 2. Build the C binary
      - name: Build dummy binary
        run: make -C examples/dummy-project

      # 3. Run ZeroLens
      - name: ZeroLens Scan (dogfood)
        id: zerolens
        uses: ./
        with:
          token: ${{ secrets.ZEROLENS_TOKEN }}
          binary: build/dummy
          warn_on_cwe: CWE-134
          max_findings: 10
          ai_analysis: true
          sarif_path: out/dummy.sarif
          wait: true
          comment_pr: true
          github_token: ${{ github.token }}

      # 4. Validate **every** output exists & is non-empty
      - name: Assert outputs
        run: |
          test -n '${{ steps.zerolens.outputs.hashes }}'
          test -n '${{ steps.zerolens.outputs.findings_json }}'
          test -n '${{ steps.zerolens.outputs.report }}'
          test -n '${{ steps.zerolens.outputs.violations }}'
          # SARIF path is only set if sarif_path was provided
          test -n '${{ steps.zerolens.outputs.sarif }}'
          echo "All outputs present ✅"

      # 5. Echo policy decision
      - run: |
          printf 'Violations: %s\n' '${{ steps.zerolens.outputs.violations }}'
          echo "Exit code should already reflect policy engine"

      # 6. Upload artefacts so we can inspect in the UI
      - name: Upload report & SARIF
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dummy-scan-artifacts
          path: |
            ${{ steps.zerolens.outputs.report }}
            out/dummy.sarif
